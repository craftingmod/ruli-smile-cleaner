name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build stable
        run: bun run build:stable

      - name: Normalize setup zip name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setupZip = Get-ChildItem "artifacts\*Setup.zip" | Select-Object -First 1
          if ($null -eq $setupZip) {
            throw "Electrobun setup zip was not found."
          }
          Copy-Item $setupZip.FullName "build\smilecleaner-setup.zip" -Force

      - name: Create portable zip
        shell: pwsh
        run: ./scripts/create-portable-win.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ruli-smile-cleaner-windows
          path: |
            build/smilecleaner-setup.zip
            build/smilecleaner-portable.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/smilecleaner-setup.zip
            build/smilecleaner-portable.zip
