name: Build Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows artifacts
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build stable
        run: bun run build:stable

      - name: Create portable zip
        shell: pwsh
        run: ./scripts/create-portable-win.ps1

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ruli-smile-cleaner-windows
          path: |
            artifacts/*
            build/ruli-smile-cleaner-portable-win-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*
            build/ruli-smile-cleaner-portable-win-x64.zip
